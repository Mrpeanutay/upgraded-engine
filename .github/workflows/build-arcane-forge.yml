name: Build Arcane Forge

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile NeoForge mod
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat build-input-xz/part*.b64 | base64 --decode > ArcaneForge-1.21.1-source.tar.xz
          tar -xJf ArcaneForge-1.21.1-source.tar.xz
          test -f ArcaneForge-1.21.1/build.gradle
          test -f ArcaneForge-1.21.1/build_mod.sh

      - name: Compile Arcane Forge
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x ArcaneForge-1.21.1/build_mod.sh ArcaneForge-1.21.1/tools/bootstrap-gradle.sh
          ./ArcaneForge-1.21.1/build_mod.sh clean build --no-daemon --stacktrace 2>&1 | tee arcane-build.log

      - name: Upload complete Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneForge-build-log
          path: arcane-build.log
          if-no-files-found: error
          retention-days: 7

      - name: List build outputs
        if: steps.compile.outcome == 'success'
        shell: bash
        run: find ArcaneForge-1.21.1/build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload compiled JAR
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneForge-1.21.1-JAR
          path: ArcaneForge-1.21.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Mark compilation failure
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: exit 1
